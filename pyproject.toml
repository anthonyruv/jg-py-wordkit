[project]
name = "wordkit"
version = "0.1.0"
description = "A small text utility library used to qualify Juggernaut against a real Python repository."
requires-python = ">=3.11"
dependencies = ["six==1.17.0"]

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
